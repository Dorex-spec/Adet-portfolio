<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="SM Monotone Emblem">
  <defs>
    <!-- Background Gradient (Monotone Dark) -->
    <radialGradient id="smBgDark" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#24242c"/>
      <stop offset="60%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="smRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60606e"/>
      <stop offset="35%" stop-color="#303038"/>
      <stop offset="70%" stop-color="#484854"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>

    <!-- SM Lettering Gradient (Silver / Light Gray to White) -->
    <linearGradient id="smLetterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e2e8"/>
      <stop offset="100%" stop-color="#b0b0bc"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="smLetterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Ring / Rim -->
  <circle cx="100" cy="100" r="94" fill="url(#smBgDark)" stroke="url(#smRimGrad)" stroke-width="6"/>
  <!-- Delicate Inner Technical Accent Ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#2e2e38" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- SM Mall Geometric Typography -->
  <g filter="url(#smLetterGlow)">
    <!-- Letter S (SM Mall Heavy Geometric Sans) -->
    <path d="M 94,76 L 79,76 C 79,71.5 75,69 66,69 C 57,69 53,72 53,77.5 C 53,82.5 58.5,85 71,88 C 88.5,92 95,97 95,108.5 C 95,121.5 84,130 66,130 C 47,130 36.5,121 36.5,107.5 L 51.5,107.5 C 51.5,114.5 57,118.5 66,118.5 C 75.5,118.5 80,114.5 80,108 C 80,102 75,99.5 62,96.5 C 44.5,92.5 37.5,87 37.5,77 C 37.5,65 48.5,58 66,58 C 83.5,58 93.5,66 94,76 Z" fill="url(#smLetterGrad)"/>

    <!-- Letter M (SM Mall Heavy Geometric Pillars with baseline V) -->
    <path d="M 103,130 L 103,59 L 121,59 L 133.5,103.5 L 146,59 L 164,59 L 164,130 L 149.5,130 L 149.5,82.5 L 138.5,119 L 128.5,119 L 117.5,82.5 L 117.5,130 Z" fill="url(#smLetterGrad)"/>
  </g>
</svg>
